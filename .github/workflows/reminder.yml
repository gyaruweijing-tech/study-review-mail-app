name: 単発リマインダー

# 復習メルマガ(newsletter.yml)とは完全に別枠。state.json も notes/ も触らない。
on:
  schedule:
    # 2026-08-07 17:25 JST (= 08:25 UTC)。JavaSilver着手リマインド。
    # Actionsの定期実行は混雑時に数分〜十数分遅れるので、17:30の少し手前に置いてある。
    # cron に年フィールドが無いため、reminder.mjs 側の FIRE_DATE で来年の誤爆を防ぐ。
    - cron: "25 8 7 8 *"
  workflow_dispatch:

# 何も書き戻さないので読み取りだけで足りる
permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 送信
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          # 手動実行(workflow_dispatch)のときは日付チェックを外してテストできる
          FIRE_DATE: ${{ github.event_name == 'schedule' && '2026-08-07' || '' }}
          SUBJECT: "【クエスト発生】★1 JavaSilverの試練"
          HTML_FILE: mails/java-silver-quest.html
          # HTMLを表示しないクライアント向けの代替テキスト
          BODY: |
            ◆クエスト発生:『JavaSilverの試練』★1

            主目的  : JavaSilverの教材を開く（進めた量は問わない）
            サブ    : 何でもいいので1問だけ解く
            制限時間: 本日中
            報酬金  : 10,000z ＋ 明日の朝の機嫌

            [受付嬢・ミサ] 受注条件は「教材を開く」だけです。開いた瞬間に達成印を押しますね
            [ギルドマスター・ガイオウ] やる気が湧くのを待つな、手を動かした奴から湧く
            [龍歴院の学者・ルナ] 気づいたら止まらなくなってるパターン、知ってるでしょ？
            [オトモ・スラ丸] まずボクを一発殴ってみるニャ！ それで達成ニャ〜

            受注方法：机に向かい、教材を開く。以上。
        run: node reminder.mjs
